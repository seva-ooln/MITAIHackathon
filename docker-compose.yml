services:
  voice-meeting-bot:
    build: .
    container_name: voice-meeting-bot
    ports:
      - "3000:3000"  # Zoom SDK port
    volumes:
      - .:/app
      - ./temp:/app/temp
      - ./data:/app/data
      - /mnt/wslg:/mnt/wslg:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EXPECTED_PARTICIPANTS=${EXPECTED_PARTICIPANTS}
      - ZOOM_APP_CLIENT_ID=${ZOOM_APP_CLIENT_ID:-}
      - ZOOM_APP_CLIENT_SECRET=${ZOOM_APP_CLIENT_SECRET:-}
      - MEETING_ID=${MEETING_ID:-}
      - MEETING_PWD=${MEETING_PWD:-}
      - DISPLAY_NAME=${DISPLAY_NAME:-Python Zoom Bot}
      - QT_QPA_PLATFORM=offscreen
      - PULSE_RUNTIME_PATH=/mnt/wslg/PulseServer
      - PULSE_AUDIO_SERVER=unix:/mnt/wslg/PulseAudio
    env_file:
      - .env
    command: python zoom_integration_bridge.py
    stdin_open: true
    tty: true

  # Optional API service (uncomment if needed)
